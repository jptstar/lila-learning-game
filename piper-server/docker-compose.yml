services:
  lila-piper:
    build: .
    container_name: lila-piper
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PIPER_VOICE: fr_FR-upmc-medium
      PIPER_SPEAKER_ID: "0"
      PIPER_LENGTH_SCALE: "1.06"
      ALLOWED_ORIGINS: https://jptstar.github.io
      # Recommandé si le service est accessible en dehors du LAN :
      # PIPER_API_TOKEN: change-moi
    volumes:
      - ./voices:/voices
      - ./cache:/cache
